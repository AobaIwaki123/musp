apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musp-api-ingress
  namespace: musp
spec:
  ingressClassName: "cloudflare-tunnel"
  rules:
  - host: musp-api.aooba.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: musp-api
            port:
              number: 80
